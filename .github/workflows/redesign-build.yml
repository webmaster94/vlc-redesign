name: Windows build and installer

on:
  workflow_dispatch:
  push:
    branches: [redesign]
    paths: [.github/workflows/redesign-build.yml, 'modules/gui/qt/**', 'modules/text_renderer/**', 'modules/codec/libass.c', 'modules/visualization/**', 'extras/package/redesign/**', 'extras/package/win32/build.sh', 'src/win32/**', 'src/audio_output/**', 'src/video_output/**', 'src/libvlc-module.c', 'bin/**']

permissions:
  contents: read

jobs:
  win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: registry.videolan.org/vlc-debian-win64-3.0:20260820114402
      options: --user root
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compile the Windows x64 player
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          contrib_name="vlc-contrib-x86_64-w64-mingw32-910cc9cada6080dd777fbafb2ebdd0c24f702c30.tar.zst"
          curl --fail --location --retry 3 -o /tmp/reframe-contrib.tar.zst "https://github.com/webmaster94/vlc-redesign/releases/download/v0.1.0/$contrib_name"
          echo "49f7690b3d09760f842f9f8e9612c28de8cbb1d027bcb3f6aaa25767611eea8c  /tmp/reframe-contrib.tar.zst" | sha256sum --check
          export VLC_PREBUILT_CONTRIBS_URL="file:///tmp/reframe-contrib.tar.zst"
          mkdir -p "$GITHUB_WORKSPACE/build-validation"
          cd "$GITHUB_WORKSPACE/build-validation"
          ../extras/package/win32/build.sh -a x86_64 -p 2>&1 | tee build.log
      - name: Stage the compiled player
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build-validation"
          make -C win64 package-win-common
      - name: Gather corresponding dependency source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build-validation/contrib/contrib-win64"
          # Reuse the verified matching source archive from the first release.
          # The linked contrib revision is unchanged; fetch still verifies every package.
          if curl --fail --location --retry 3 -o /tmp/reframe-contrib-source.tar.xz https://github.com/webmaster94/vlc-redesign/releases/download/v0.1.0/Reframe-3.0.24-r1-dependency-source.tar.xz; then
            echo "82cb6c47af0723693f015e1b0f4e6afc36b461b38c2cbbf20de52a52100ce643  /tmp/reframe-contrib-source.tar.xz" | sha256sum --check
            tar -xJf /tmp/reframe-contrib-source.tar.xz -C "$GITHUB_WORKSPACE/contrib"
          fi
          make -j4 fetch PKGS_FOUND= 2>&1 | tee "$GITHUB_WORKSPACE/build-validation/dependency-source.log"
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          tar -cJf dist/Reframe-3.0.24-r3-dependency-source.tar.xz -C contrib tarballs
          python3 extras/package/redesign/collect-notices.py --archives contrib/tarballs --existing build-validation/contrib/x86_64-w64-mingw32/share/licenses --output build-validation/dependency-licenses
      - name: Build the NSIS installer
        env:
          OPENSUBTITLES_APP_KEY: ${{ secrets.OPENSUBTITLES_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build-validation"
          python3 ../extras/package/redesign/package.py --payload win64/vlc-3.0.24 --licenses dependency-licenses --output "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE"
          git archive --format=tar --prefix=reframe-source/ HEAD | xz > dist/Reframe-3.0.24-r3-source.tar.xz
          cp doc/redesign/credits.txt dist/CREDITS.txt
          (cd dist && sha256sum *source.tar.xz) >> dist/SHA256SUMS
      - name: Keep installer and portable player
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reframe-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.xz
            dist/SHA256SUMS
            dist/CREDITS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-build-logs
          path: |
            build-validation/build.log
            build-validation/win64/config.log
            build-validation/dependency-source.log
          if-no-files-found: warn
          retention-days: 14
  windows-smoke:
    needs: win64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reframe-windows-x64
          path: artifacts
      - name: Check rendering playback and installer isolation
        shell: pwsh
        run: ./extras/package/redesign/smoke.ps1 -Artifacts ./artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reframe-windows-preview
          path: |
            artifacts/preview.png
            artifacts/controls-player.png
            artifacts/controls-settings.png
            artifacts/controls.txt.page*.png
            artifacts/controls.txt.flow*.png
            artifacts/controls.txt
            artifacts/first-run-*.txt
            artifacts/first-run-*.png
            artifacts/waveform.png
